server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: agent-websocket
          uri: lb:ws://agent-service
          predicates:
            - Path=/ws/**
        - id: agent-api
          uri: lb://agent-service
          predicates:
            - Path=/api/**
        - id: agent-ui
          uri: lb://agent-service
          predicates:
            - Path=/**
          order: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
