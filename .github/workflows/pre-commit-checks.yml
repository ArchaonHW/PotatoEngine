name: Pre-commit Checks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Source/**/*.h'
      - 'Source/**/*.cpp'
      - 'Plugins/**/*.h'
      - 'Plugins/**/*.cpp'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Source/**/*.h'
      - 'Source/**/*.cpp'
      - 'Plugins/**/*.h'
      - 'Plugins/**/*.cpp'

jobs:
  syntax-check:
    name: Syntax Validation
    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Syntax Check
      shell: powershell
      run: |
        & .\Tools\build\PreCommitSyntaxCheck.ps1
        if ($LASTEXITCODE -ne 0) { 
          Write-Host "Syntax check failed!"
          exit 1 
        }

  header-validation:
    name: Unreal Header Validation
    runs-on: windows-latest
    needs: syntax-check
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find Modified Headers
      id: changed-files
      shell: powershell
      run: |
        $changed = git diff --name-only HEAD~1 HEAD | Where-Object { $_ -match '\.(h|cpp)$' }
        if ($changed) {
          $files = $changed -join ','
          "files=$files" >> $env:GITHUB_OUTPUT
        }

    - name: Basic Header Check
      shell: powershell
      run: |
        $headers = Get-ChildItem -Path Source, Plugins -Recurse -Include "*.h" -File
        $errors = 0
        foreach ($h in $headers) {
          $content = Get-Content $h.FullName -Raw
          # Check for GENERATED_BODY
          if (-not ($content -match 'GENERATED_BODY\(\)')) {
            Write-Output "Warning: $($h.FullName) may be missing GENERATED_BODY()"
          }
        }
        exit 0

  build-check:
    name: Build Verification
    runs-on: windows-latest
    needs: [syntax-check, header-validation]
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Project Files
      shell: powershell
      run: |
        & "C:\Program Files\Epic Games\UE_5.4\Engine\Build\BatchFiles\Build.bat" `
          -projectfiles -project="${{ github.workspace }}\MingGoRTS.uproject" `
          -game -engine -progress

    - name: Compile Project
      shell: powershell
      run: |
        & "C:\Program Files\Epic Games\UE_5.4\Engine\Build\BatchFiles\Build.bat" `
          MingGoRTSEditor Win64 Development `
          -project="${{ github.workspace }}\MingGoRTS.uproject" `
          -WaitMutex -FromMsBuild
