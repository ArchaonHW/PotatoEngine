name: Pre-commit Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check banned C functions
      run: |
        echo "Scanning for banned unsafe functions..."
        BANNED='(gets|strcpy|strcat|sprintf|vsprintf|scanf)\s*\('
        if grep -rnE --include='*.cpp' --include='*.h' --exclude-dir=external --exclude-dir=build --exclude-dir=_bmad "$BANNED" . ; then
          echo "::error::Banned unsafe functions found (gets/strcpy/strcat/sprintf/vsprintf/scanf)"
          exit 1
        fi
        echo "No banned functions found."

    - name: Check for hardcoded secrets
      run: |
        echo "Scanning for hardcoded secrets..."
        PATTERN='(BEGIN [A-Z ]*PRIVATE KEY|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9\-]{10,}|AKIA[0-9A-Z]{16})'
        if grep -rnE --exclude-dir=.git --exclude-dir=external --exclude-dir=build --exclude-dir=_bmad --exclude-dir=.agents "$PATTERN" . ; then
          echo "::error::Potential secrets found!"
          exit 1
        fi
        echo "No secrets found."
        
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build
      run: |
        cd build
        cmake --build . --config Release