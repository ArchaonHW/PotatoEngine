name: Pre-commit Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Syntax Check
      shell: pwsh
      run: |
        if (Test-Path .\Tools\build\PreCommitSyntaxCheck.ps1) {
          & .\Tools\build\PreCommitSyntaxCheck.ps1
          exit $LASTEXITCODE
        } else {
          Write-Host "Syntax check script not found, skipping..."
          exit 0
        }
      continue-on-error: true
