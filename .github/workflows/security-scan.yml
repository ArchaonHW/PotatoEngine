name: Security Scan / 安全掃描

on:
  push:
    branches: [ main, develop, 'release/*' ]
    paths:
      - 'Source/**'
      - 'Plugins/**'
      - 'Config/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Source/**'
      - 'Plugins/**'
      - 'Config/**'
  schedule:
    # 每天凌晨2點運行 / Run daily at 2 AM
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan Type / 掃描類型'
        required: true
        default: 'Full'
        type: choice
        options:
          - Full
          - Code
          - Dependencies
          - Quick

jobs:
  security-scan:
    name: Security Vulnerability Scan / 安全漏洞掃描
    runs-on: windows-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code / 檢出代碼
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache scan results / 緩存掃描結果
      uses: actions/cache@v4
      with:
        path: Reports/Security
        key: security-scan-${{ github.sha }}
        restore-keys: |
          security-scan-

    - name: Run Security Scan / 執行安全掃描
      id: security_scan
      shell: pwsh
      run: |
        $scanType = "${{ github.event.inputs.scan_type || 'Full' }}"
        Write-Host "Starting security scan: $scanType"
        
        & .\Tools\security\SecurityScan.ps1 `
          -ScanType $scanType `
          -OutputPath "Reports\Security" `
          -GenerateReport `
          -FailOnCritical
      
    - name: Upload scan results / 上傳掃描結果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: Reports/Security/
        retention-days: 30

    - name: Comment PR with results / PR評論結果
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'Reports/Security/scan.log';
          
          let scanOutput = '';
          if (fs.existsSync(path)) {
            scanOutput = fs.readFileSync(path, 'utf8');
          }
          
          const summary = scanOutput.split('\n').slice(-20).join('\n');
          
          const body = `## 🔒 Security Scan Results / 安全掃描結果
          
          \`\`\`
          ${summary}
          \`\`\`
          
          <details>
          <summary>View full log / 查看完整日誌</summary>
          
          \`\`\`
          ${scanOutput}
          \`\`\`
          
          </details>
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Check for critical issues / 檢查嚴重問題
      if: failure()
      run: |
        echo "❌ Critical security issues found!"
        echo "發現嚴重安全問題，阻止構建"
        exit 1

    - name: Generate SARIF report / 生成SARIF報告
      if: always()
      shell: pwsh
      run: |
        # 轉換掃描結果為SARIF格式以支持GitHub Advanced Security
        $jsonReport = Get-ChildItem -Path "Reports\Security" -Filter "*.json" | Select-Object -First 1
        if ($jsonReport) {
          Write-Host "Found JSON report: $($jsonReport.FullName)"
          # 這裡可以添加轉換邏輯將JSON轉為SARIF格式
        }

  dependency-review:
    name: Dependency Review / 依賴審查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code / 檢出代碼
      uses: actions/checkout@v4
      
    - name: Dependency Review / 依賴審查
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: high
        comment-summary-in-pr: true

  codeql-analysis:
    name: CodeQL Analysis / CodeQL分析
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code / 檢出代碼
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL / 初始化CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        queries: security-extended,security-and-quality
    
    - name: Autobuild / 自動構建
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis / 執行CodeQL分析
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:cpp"

  secret-scan:
    name: Secret Detection / 機密檢測
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code / 檢出代碼
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Secret Detection / 機密檢測
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
